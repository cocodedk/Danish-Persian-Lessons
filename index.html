<script>
try {
  const row = JSON.parse(localStorage.getItem('dpl.v1.colorMode') || 'null')
  const mode = row?.schemaVersion === 1 ? row.value?.colorMode : null
  if (mode === 'light' || mode === 'dark') document.documentElement.classList.add(`scheme-${mode}`)
} catch { /* The device colours remain in use when storage is blocked. */ }
</script>

<!-- The cocode.dk family frame, outside the React tree on purpose: #root is the
     app's own mount point, and the frame must not re-render on every route change.
     Wrapped in native landmarks: axe's "region" rule (WCAG best practice) flags any
     top-level content not contained by a landmark, and a bare custom element is not one. -->
<header>
<cocode-head project="Lær persisk skrift" accent="var(--red)" on-accent="#F7F2E9" dark="auto">
