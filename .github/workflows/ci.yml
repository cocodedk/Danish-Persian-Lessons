name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

# PR/branch CI: safe to cancel a superseded run — a newer push makes the old run
# irrelevant. (Never do this on a deploy workflow — see deploy-pages.yml.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id must stay exactly "verify" — branch protection pins its required status
  # check to this context name.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser test engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run verification (lint, tests, build, scripts/verify.sh)
        run: npm run verify
