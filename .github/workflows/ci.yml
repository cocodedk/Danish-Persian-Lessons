name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

# PR/branch CI: safe to cancel a superseded run — a newer push makes the old run
# irrelevant. (Never do this on a deploy workflow — see deploy-pages.yml.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id must stay exactly "verify" — branch protection pins its required status
  # check to this context name.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verification (lint, tests, build, scripts/verify.sh)
        run: npm run verify
