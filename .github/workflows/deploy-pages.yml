name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'llms.txt'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploy workflow: never cancel a run in flight — cancelling mid-deploy can leave
# GitHub Pages half-published. Runs serialize instead of racing. See
# ~/.claude-personal/skills/github-setup/references/ci-cd-git-gotchas.md
# ("Use cancel-in-progress: true only on PR CI, never on deploy/publish").
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Copy llms.txt into the published site
        run: cp llms.txt website/llms.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      # NOTE(docs/plans/001): once the Vite React app lands, this workflow gains a
      # build step (`npm ci && npm run build`) and composes _site = website/ + dist/,
      # publishing the app under _site/app/ instead of uploading website/ directly.
